server {
    listen 80;
    server_name localhost;
    
    root /usr/share/nginx/html;
    index index.html;

    # Habilitar compresión gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json image/svg+xml;

    # Configuración de caché para assets estáticos
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|avif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Servir archivos estáticos de la galería
    location /gallery/ {
        try_files $uri $uri/ =404;
    }

    # Servir index.html para todas las rutas (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Seguridad: ocultar versión de nginx
    server_tokens off;

    # Headers de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
